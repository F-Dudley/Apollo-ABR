[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "abr-sim"
version = "0.1.0"
description = "Adaptive bitrate streaming simulation framework for ABR transition generation."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Finn Dudley" }
]
dependencies = [
    "tqdm",
    "numpy",
    "pandas",
    "pyarrow",
    "pyzmq",
    "msgpack",
]


[project.optional-dependencies]
dev = [

]


[project.scripts]
abr-sim = "Run_ABR_Sim:main"
temporal-builder = "Run_Temporal_Builder:main"


[tool.setuptools]
py-modules = ["Run_ABR_Sim"]


[tool.setuptools.packages.find]
where = ["."]
include = ["ABR_Sim*"]


[tool.ruff]
line-length = 88
target-version = "py311"


[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = []


[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false